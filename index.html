<!doctype html>
<html lang="id">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Simulasi PSTS / ASTS - Bahasa Inggris & Seni Rupa</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg: #0f172a;
      --card: #1e293b;
      --border: #334155;
      --text: #f8fafc;
      --muted: #94a3b8;
      --primary: #3b82f6;
      --primary-hover: #2563eb;
      --success: #10b981;
      --success-bg: rgba(16, 185, 129, 0.15);
      --danger: #ef4444;
      --danger-bg: rgba(239, 68, 68, 0.15);
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: 'Plus Jakarta Sans', sans-serif;
      background-color: var(--bg);
      color: var(--text);
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 16px;
      line-height: 1.5;
    }

    .container {
      width: 100%;
      max-width: 760px;
    }

    .card {
      background-color: var(--card);
      border: 1px solid var(--border);
      border-radius: 20px;
      padding: 24px;
      box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.3);
    }

    .hidden { display: none !important; }

    /* HOME SCREEN */
    .app-header {
      margin-bottom: 24px;
      text-align: center;
    }
    .app-header h1 {
      font-size: 24px;
      font-weight: 800;
      letter-spacing: -0.02em;
      margin-bottom: 8px;
    }
    .app-header p {
      color: var(--muted);
      font-size: 14px;
    }

    .subject-grid {
      display: grid;
      grid-template-columns: 1fr;
      gap: 16px;
      margin-top: 20px;
    }
    @media(min-width: 600px) {
      .subject-grid { grid-template-columns: 1fr 1fr; }
    }

    .btn-subject {
      background: #273549;
      border: 1px solid var(--border);
      border-radius: 16px;
      padding: 20px;
      text-align: left;
      color: var(--text);
      cursor: pointer;
      transition: all 0.2s ease;
    }
    .btn-subject:hover {
      border-color: var(--primary);
      transform: translateY(-2px);
      background: #2d3d54;
    }
    .btn-subject h3 {
      font-size: 18px;
      font-weight: 700;
      margin-bottom: 4px;
    }
    .btn-subject span {
      font-size: 13px;
      color: var(--muted);
      font-weight: 500;
    }

    /* QUIZ SCREEN */
    .quiz-bar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 16px;
    }
    .badge {
      background: rgba(59, 130, 246, 0.2);
      color: #60a5fa;
      font-size: 12px;
      font-weight: 700;
      padding: 4px 10px;
      border-radius: 20px;
      text-transform: uppercase;
    }
    .meta-text {
      font-size: 13px;
      color: var(--muted);
      font-weight: 600;
    }

    .progress-track {
      width: 100%;
      height: 8px;
      background: var(--border);
      border-radius: 10px;
      overflow: hidden;
      margin-bottom: 24px;
    }
    .progress-fill {
      height: 100%;
      background: var(--primary);
      width: 0%;
      transition: width 0.3s ease;
    }

    .question-text {
      font-size: 16px;
      font-weight: 600;
      margin-bottom: 20px;
      white-space: pre-line;
    }

    .options-list {
      display: flex;
      flex-direction: column;
      gap: 12px;
      margin-bottom: 20px;
    }
    .btn-option {
      background: #243144;
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 14px 16px;
      text-align: left;
      color: var(--text);
      font-size: 14px;
      font-weight: 500;
      cursor: pointer;
      display: flex;
      align-items: flex-start;
      gap: 10px;
      transition: all 0.15s ease;
    }
    .btn-option:hover:not(:disabled) {
      border-color: var(--primary);
      background: #2a3a52;
    }
    .btn-option:disabled { cursor: default; }

    .btn-option.opt-correct {
      background: var(--success-bg) !important;
      border-color: var(--success) !important;
      color: #6ee7b7;
    }
    .btn-option.opt-wrong {
      background: var(--danger-bg) !important;
      border-color: var(--danger) !important;
      color: #fca5a5;
    }

    .feedback-box {
      border-radius: 12px;
      padding: 14px 16px;
      margin-bottom: 20px;
      font-size: 13px;
      line-height: 1.6;
    }
    .feedback-box.correct {
      background: var(--success-bg);
      border: 1px solid var(--success);
      color: #a7f3d0;
    }
    .feedback-box.wrong {
      background: var(--danger-bg);
      border: 1px solid var(--danger);
      color: #fecaca;
    }

    .nav-actions {
      display: flex;
      justify-content: space-between;
      gap: 12px;
    }
    .btn {
      padding: 12px 20px;
      border-radius: 12px;
      font-size: 14px;
      font-weight: 700;
      cursor: pointer;
      border: none;
      transition: opacity 0.2s;
    }
    .btn:hover { opacity: 0.9; }
    .btn-secondary { background: var(--border); color: var(--text); }
    .btn-primary { background: var(--primary); color: #fff; }
    .btn:disabled { opacity: 0.4; cursor: not-allowed; }

    /* RESULT SCREEN */
    .result-box { text-align: center; padding: 20px 0; }
    .score-big {
      font-size: 48px;
      font-weight: 800;
      color: var(--primary);
      margin: 10px 0;
    }
    .advice-card {
      background: #243144;
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 16px;
      font-size: 14px;
      margin: 20px 0;
      text-align: left;
    }
  </style>
</head>
<body>
  <div class="container">
    
    <!-- HOME SCREEN -->
    <div id="screen-home" class="card">
      <div class="app-header">
        <h1>Simulasi PSTS/ASTS KLS 8</h1>
        <p>Latihan mandiri persiapannya ujian. Pilih mata pelajaran di bawah untuk mulai:</p>
      </div>
      <div class="subject-grid">
        <button class="btn-subject" onclick="initQuiz('inggris')">
          <h3>🇬🇧 Bahasa Inggris</h3>
          <span>50 Soal • 10 Materi Utama</span>
        </button>
        <button class="btn-subject" onclick="initQuiz('seni')">
          <h3>🎨 Seni Rupa</h3>
          <span>50 Soal • Sesuai Kisi-kisi PSTS</span>
        </button>
      </div>
    </div>

    <!-- QUIZ SCREEN -->
    <div id="screen-quiz" class="card hidden">
      <div class="quiz-bar">
        <span id="quiz-badge" class="badge">Mata Pelajaran</span>
        <span id="quiz-num" class="meta-text">Soal 1 dari 50</span>
      </div>
      <div class="progress-track">
        <div id="progress-fill" class="progress-fill"></div>
      </div>

      <div id="question-text" class="question-text"></div>
      <div id="options-list" class="options-list"></div>
      
      <div id="feedback-box" class="feedback-box hidden"></div>

      <div class="nav-actions">
        <button class="btn btn-secondary" onclick="exitToHome()">🏠 Keluar</button>
        <button id="btn-next" class="btn btn-primary" onclick="nextQuestion()" disabled>Soal Berikutnya ➜</button>
      </div>
    </div>

    <!-- RESULT SCREEN -->
    <div id="screen-result" class="card hidden">
      <div class="result-box">
        <h2>Ujian Selesai!</h2>
        <p class="meta-text">Hasil perolehan nilai latihan kamu:</p>
        <div id="score-display" class="score-big">0/50</div>
        <p id="score-percent" class="meta-text" style="font-size: 16px; font-weight:700;"></p>
        
        <div id="advice-text" class="advice-card"></div>

        <button class="btn btn-primary" onclick="exitToHome()">🔄 Kembali ke Menu Utama</button>
      </div>
    </div>

  </div>

<script>
// DATA SOAL BAHASA INGGRIS (50 SOAL)
const rawEnglish = [
  // 1. Classroom Language
  ["Teacher: \"_____, open your book on page 12.\" What is the suitable expression?", ["Attention, please", "I agree with you", "Happy birthday", "Good night"], 0, "Jawaban: 'Attention, please'. Kalimat meminta perhatian saat di kelas."],
  ["Student: \"_____ I wash my hands, Sir?\"\nTeacher: \"Yes, sure.\"", ["May", "Must", "Will", "Should"], 0, "Jawaban: 'May'. Digunakan untuk meminta izin secara sopan."],
  ["Teacher: \"Keep quiet, please! The test is starting.\"\nWhat does the teacher mean?", ["Asking students to be quiet", "Asking students to speak louder", "Asking students to read", "Asking students to leave"], 0, "Jawaban: meminta siswa untuk tenang/diam."],
  ["Student: \"Sorry for being late, Ma'am.\"\nTeacher: \"_____. Sit down, please.\"", ["That's alright", "You are welcome", "I don't care", "Goodbye"], 0, "Jawaban: 'That's alright' merespons permohonan maaf."],
  ["Teacher: \"_____ the whiteboard, please!\"\nStudent: \"Yes, Sir.\"", ["Clean", "Eat", "Sleep", "Listen"], 0, "Jawaban: 'Clean' (bersihkan papan tulis)."],

  // 2. Compliment
  ["Rani: \"I made this cupcake for you.\"\nSiti: \"Wow, _____! It tastes amazing!\"", ["What a delicious cupcake", "How terrible it is", "I hate it", "It is so bad"], 0, "Jawaban: 'What a delicious cupcake' (pujian atas makanan enak)."],
  ["Deni: \"Look at my new drawing.\"\nBudi: \"_____. You are so talented!\"", ["That's fantastic", "It looks messy", "I don't like it", "You should stop"], 0, "Jawaban: 'That's fantastic' merupakan ungkapan pujian."],
  ["Which statement is an expression of compliment?", ["You look great today!", "Where are you going?", "I don't feel good.", "Please open the door."], 0, "Jawaban: 'You look great today!' (memberi pujian pada penampilan)."],
  ["Sinta: \"What a beautiful dress!\"\nLestari: \"_____.\"", ["Thank you very much", "No problem", "I am sorry", "You're welcome"], 0, "Jawaban: merespons pujian dengan ucapan terima kasih."],
  ["John: \"You played the guitar so well!\"\nAlex: \"_____.\"", ["I'm glad you liked it", "I am not fine", "It is terrible", "Don't look at me"], 0, "Jawaban: 'I'm glad you liked it' adalah respons atas pujian."],

  // 3. Certainty
  ["Riko: \"Are you sure we have homework today?\"\nDino: \"_____. The teacher told us this morning.\"", ["Yes, I am certain", "I am not sure", "I doubt it", "I don't know"], 0, "Jawaban: 'Yes, I am certain' menyatakan keyakinan."],
  ["Siti: \"Is the library open on Sunday?\"\nLia: \"I'm 100% sure it is closed.\" Lia expresses _____.", ["certainty", "uncertainty", "dislike", "congratulation"], 0, "Jawaban: certainty (kepastian)."],
  ["Which expression shows certainty?", ["I am absolutely sure about it.", "Maybe it will rain.", "I have no idea.", "I am not really sure."], 0, "Jawaban: 'I am absolutely sure about it.'"],
  ["Andi: \"Will our team win the match?\"\nBagas: \"_____. They have trained hard for weeks.\"", ["I'm positive about that", "I am doubtful", "I don't think so", "Maybe not"], 0, "Jawaban: 'I'm positive about that' menunjukkan keyakinan."],
  ["Teacher: \"Is Paris the capital of France?\"\nStudent: \"Yes, I am _____ sure it is.\"", ["completely", "doubtfully", "hesitantly", "never"], 0, "Jawaban: 'completely' (sangat yakin)."],

  // 4. Uncertainty
  ["Maya: \"Will Mr. Han come to class today?\"\nEko: \"_____. He said he felt unwell yesterday.\"", ["I'm not really sure", "I am certain", "Without a doubt", "Definitely yes"], 0, "Jawaban: 'I'm not really sure' menunjukkan keraguan/ketidakpastian."],
  ["Rizal: \"Is the concert starting at 7 PM?\"\nFani: \"_____. We should check the ticket again.\"", ["I doubt it", "I am 100% sure", "It is certain", "Of course"], 0, "Jawaban: 'I doubt it' (saya ragu)."],
  ["Expressing uncertainty means you are _____ about something.", ["not sure", "very confident", "happy", "angry"], 0, "Jawaban: 'not sure'."],
  ["Dina: \"Do you think it will rain this afternoon?\"\nToni: \"_____ because the sky is cloudy, but who knows?\"", ["I'm not certain", "I am sure", "I am positive", "Definitely"], 0, "Jawaban: 'I'm not certain'."],
  ["Which phrase shows uncertainty?", ["I have doubts about that.", "I am totally sure.", "I know for certain.", "It is clear."], 0, "Jawaban: 'I have doubts about that.'"],

  // 5. Like & Dislike
  ["I _____ playing football in the afternoon. It is my favorite hobby.", ["enjoy", "hate", "dislike", "cannot stand"], 0, "Jawaban: 'enjoy' karena merupakan hobi."],
  ["Siska: \"Do you like spicy food?\"\nDoni: \"No, I _____. It hurts my stomach.\"", ["dislike it", "love it", "am fond of it", "really enjoy it"], 0, "Jawaban: 'dislike it' karena perutnya sakit."],
  ["Maya: \"What do you think of horror movies?\"\nLia: \"I _____ them. They give me nightmares!\"", ["hate", "love", "like", "enjoy"], 0, "Jawaban: 'hate' (benci)."],
  ["Which sentence expresses a preference/like?", ["I am crazy about pop music.", "I can't stand loud noises.", "I detest waiting in line.", "I don't like coffee."], 0, "Jawaban: 'I am crazy about pop music.'"],

  // 6. Recount Text
  ["What is the main purpose of a recount text?", ["To retell past events or experiences", "To describe a person in detail", "To persuade readers to buy something", "To explain how to make something"], 0, "Jawaban: menceritakan pengalaman masa lalu."],
  ["The generic structure of a Recount Text is _____.", ["Orientation - Events - Reorientation", "Identification - Description", "Goal - Materials - Steps", "Thesis - Arguments - Conclusion"], 0, "Jawaban: Orientation - Events - Reorientation."],
  ["In a recount text, 'Orientation' provides information about _____.", ["Who, where, and when the story happened", "The final resolution of the problem", "Steps to solve a issue", "A list of tools needed"], 0, "Jawaban: berisi latar belakang tokoh, tempat, dan waktu."],

  ["\"Last week, my family and I went to Kuta Beach.\" This sentence belongs to the _____ section.", ["Orientation", "Events", "Reorientation", "Resolution"], 0, "Jawaban: Orientation (pembuka cerita)."],

  ["They _____ to Bali for holiday last month.", ["went", "go", "goes", "going"], 0, "Jawaban: 'went' adalah V2 dari 'go'."],
  ["She _____ a delicious dinner for us yesterday.", ["cooked", "cooks", "cooking", "is cooking"], 0, "Jawaban: 'cooked' (Simple Past)."],
  ["Negative form of 'He bought a new bicycle yesterday' is _____.", ["He did not buy a new bicycle yesterday", "He does not buy a new bicycle yesterday", "He did not bought a new bicycle yesterday", "He was not buy a new bicycle yesterday"], 0, "Jawaban: 'He did not buy...' (did + V1)."],
  ["_____ you watch the football match on TV last night?", ["Did", "Do", "Does", "Were"], 0, "Jawaban: 'Did' untuk kata kerja lampau."],
  ["I _____ very tired after running yesterday afternoon.", ["was", "were", "am", "is"], 0, "Jawaban: 'was' (to be lampau untuk subjek 'I')."],

  // 8. Time Connective

  ["_____ we finished our test, we collected the answer sheets.", ["After", "Beforehand", "Next week", "In the future"], 0, "Jawaban: 'After' (setelah)."],
  ["\"_____ , we arrived safely at home around 9 PM.\"", ["Finally", "First", "Initially", "To begin with"], 0, "Jawaban: 'Finally' (akhirnya) untuk penutup urutan cerita."],

  // 9. Personality Traits

  ["Doni always says 'please' and 'thank you'. He is a very _____ boy.", ["polite", "rude", "dishonest", "greedy"], 0, "Jawaban: 'polite' (sopan)."],
  ["Sarah never tells lies. Everyone trusts her because she is _____.", ["honest", "cruel", "careless", "selfish"], 0, "Jawaban: 'honest' (jujur)."],

  ["Rian is very _____. He always helps his mother clean the house without being asked.", ["helpful", "stubborn", "shy", "impatient"], 0, "Jawaban: 'helpful' (suka membantu)."],

  // 10. Congratulation

  ["Rifky: \"I just passed the final exam!\"\nBobi: \"_____! I'm so proud of you!\"", ["Congratulations", "Good luck next time", "I hope you fail", "Pardon me"], 0, "Jawaban: 'Congratulations!'."],
  ["Which situation requires you to say 'Congratulations'?", ["Your friend graduates from university", "Your friend gets sick", "Your friend loses their wallet", "Your friend is crying"], 0, "Jawaban: saat teman lulus kuliah."],

const rawArt = [

let currentQuizData = [];
let currentIndex = 0;
let currentScore = 0;
let isAnswered = false;
let currentSubjectTitle = "";

// SHUFFLE ALGORITHM (Fisher-Yates)
function shuffleArray(array) {
  let arr = [...array];
  for (let i = arr.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [arr[i], arr[j]] = [arr[j], arr[i]];
  }
  return arr;
}

function processAndShuffleData(rawData) {
  return rawData.map(item => {
    let qText = item[0];
    let opts = [...item[1]];
    let correctText = opts[item[2]];
    let exp = item[3];

    // Shuffle options
    let shuffledOpts = shuffleArray(opts);
    let newCorrectIndex = shuffledOpts.indexOf(correctText);

    return {
      q: qText,
      options: shuffledOpts,
      correct: newCorrectIndex,
      explanation: exp
    };
  });
}

function initQuiz(subject) {
  if(subject === 'inggris') {
    currentQuizData = processAndShuffleData(rawEnglish);
    currentSubjectTitle = "🇬🇧 Bahasa Inggris";
  } else {
    currentQuizData = processAndShuffleData(rawArt);
    currentSubjectTitle = "🎨 Seni Rupa";
  }

  currentIndex = 0;
  currentScore = 0;

  document.getElementById('screen-home').classList.add('hidden');
  document.getElementById('screen-result').classList.add('hidden');
  document.getElementById('screen-quiz').classList.remove('hidden');

  document.getElementById('quiz-badge').textContent = currentSubjectTitle;
  renderQuestion();
}

function renderQuestion() {
  isAnswered = false;
  const qData = currentQuizData[currentIndex];

  document.getElementById('quiz-num').textContent = `Soal ${currentIndex + 1} dari ${currentQuizData.length}`;
  document.getElementById('progress-fill').style.width = `${((currentIndex) / currentQuizData.length) * 100}%`;
  
  document.getElementById('question-text').textContent = qData.q;
  
  const optionsContainer = document.getElementById('options-list');
  optionsContainer.innerHTML = '';

  const labels = ['A', 'B', 'C', 'D'];
  qData.options.forEach((optText, idx) => {
    const btn = document.createElement('button');
    btn.className = 'btn-option';
    btn.innerHTML = `<strong>${labels[idx]}.</strong> <span>${optText}</span>`;
    btn.onclick = () => selectAnswer(idx);
    optionsContainer.appendChild(btn);
  });

  const fbBox = document.getElementById('feedback-box');
  fbBox.className = 'feedback-box hidden';
  fbBox.innerHTML = '';

  const nextBtn = document.getElementById('btn-next');
  nextBtn.disabled = true;
  nextBtn.textContent = (currentIndex === currentQuizData.length - 1) ? "Lihat Hasil 🎯" : "Soal Berikutnya ➜";
}

function selectAnswer(selectedIndex) {
  if(isAnswered) return;
  isAnswered = true;

  const qData = currentQuizData[currentIndex];
  const optionButtons = document.querySelectorAll('.btn-option');
  const fbBox = document.getElementById('feedback-box');

  optionButtons.forEach(btn => btn.disabled = true);

  // Highlight Correct Answer
  optionButtons[qData.correct].classList.add('opt-correct');

  if(selectedIndex === qData.correct) {
    currentScore++;
    fbBox.className = 'feedback-box correct';
    fbBox.innerHTML = `<strong>✅ TEPAT SEKALI!</strong><br>${qData.explanation}`;
  } else {
    optionButtons[selectedIndex].classList.add('opt-wrong');
    fbBox.className = 'feedback-box wrong';
    fbBox.innerHTML = `<strong>❌ KURANG TEPAT</strong><br>Jawaban benar: <strong>${['A','B','C','D'][qData.correct]}. ${qData.options[qData.correct]}</strong><br>${qData.explanation}`;
  }

  fbBox.classList.remove('hidden');
  document.getElementById('btn-next').disabled = false;
}

function nextQuestion() {
  if(!isAnswered) return;

  if(currentIndex < currentQuizData.length - 1) {
    currentIndex++;
    renderQuestion();
  } else {
    showResults();
  }
}

function showResults() {
  document.getElementById('screen-quiz').classList.add('hidden');
  document.getElementById('screen-result').classList.remove('hidden');

  const total = currentQuizData.length;
  const percentage = Math.round((currentScore / total) * 100);

  document.getElementById('score-display').textContent = `${currentScore} / ${total}`;
  document.getElementById('score-percent').textContent = `Nilai Akhir: ${percentage}`;

  const adviceEl = document.getElementById('advice-text');
  if(percentage >= 86) {
    adviceEl.innerHTML = "<strong>🔥 Luar Biasa!</strong> Pemahaman materi lu udah matang banget. Tinggal jaga konsistensi belajar pas hari-H ujian nanti!";
  } else if(percentage >= 70) {
    adviceEl.innerHTML = "<strong>👍 Sudah Bagus!</strong> Nilai lu udah aman, tapi masih ada beberapa soal yang terkecoh. Coba koreksi lagi bagian yang salah tadi.";
  } else {
    adviceEl.innerHTML = "<strong>📚 Perlu Ditingkatkan!</strong> Jangan patah semangat. Pelajari lagi konsep dasar & kisi-kisinya, lalu coba ulang latihan ini sekali lagi!";
  }
}

function exitToHome() {
  document.getElementById('screen-quiz').classList.add('hidden');
  document.getElementById('screen-result').classList.add('hidden');
  document.getElementById('screen-home').classList.remove('hidden');
}
