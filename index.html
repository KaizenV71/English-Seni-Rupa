<!doctype html>
<html lang="id">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Simulasi PSTS / ASTS - Bahasa Inggris & Seni Rupa</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg: #0f172a;
      --card: #1e293b;
      --border: #334155;
      --text: #f8fafc;
      --muted: #94a3b8;
      --primary: #3b82f6;
      --success-bg: rgba(16, 185, 129, 0.2);
      --success-border: #10b981;
      --danger-bg: rgba(239, 68, 68, 0.2);
      --danger-border: #ef4444;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: 'Plus Jakarta Sans', sans-serif;
      background-color: var(--bg);
      color: var(--text);
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 16px;
      line-height: 1.5;
    }

    .container { width: 100%; max-width: 720px; }
    .card {
      background-color: var(--card);
      border: 1px solid var(--border);
      border-radius: 16px;
      padding: 24px;
      box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.3);
    }

    .hidden { display: none !important; }

    /* HOME SCREEN */
    .app-header { text-align: center; margin-bottom: 24px; }
    .app-header h1 { font-size: 22px; font-weight: 800; margin-bottom: 8px; }
    .app-header p { color: var(--muted); font-size: 14px; }

    .subject-grid {
      display: grid;
      grid-template-columns: 1fr;
      gap: 16px;
    }
    @media(min-width: 500px) {
      .subject-grid { grid-template-columns: 1fr 1fr; }
    }

    .btn-subject {
      background: #273549;
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 20px;
      text-align: left;
      color: var(--text);
      cursor: pointer;
    }
    .btn-subject:hover { border-color: var(--primary); background: #2d3d54; }
    .btn-subject h3 { font-size: 18px; margin-bottom: 4px; }
    .btn-subject span { font-size: 13px; color: var(--muted); }

    /* QUIZ SCREEN */
    .quiz-bar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 12px;
    }
    .badge {
      background: rgba(59, 130, 246, 0.2);
      color: #60a5fa;
      font-size: 12px;
      font-weight: 700;
      padding: 4px 10px;
      border-radius: 20px;
    }
    .meta-text { font-size: 13px; color: var(--muted); font-weight: 600; }

    .progress-track {
      width: 100%;
      height: 8px;
      background: var(--border);
      border-radius: 10px;
      overflow: hidden;
      margin-bottom: 20px;
    }
    .progress-fill { height: 100%; background: var(--primary); width: 0%; transition: width 0.2s; }

    .question-text { font-size: 16px; font-weight: 600; margin-bottom: 20px; white-space: pre-line; }

    .options-list { display: flex; flex-direction: column; gap: 10px; margin-bottom: 20px; }
    .btn-option {
      background: #243144;
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 12px 16px;
      text-align: left;
      color: var(--text);
      font-size: 14px;
      cursor: pointer;
      display: flex;
      gap: 10px;
    }
    .btn-option:hover:not(:disabled) { border-color: var(--primary); background: #2a3a52; }

    .btn-option.opt-correct { background: var(--success-bg) !important; border-color: var(--success-border) !important; color: #6ee7b7; }
    .btn-option.opt-wrong { background: var(--danger-bg) !important; border-color: var(--danger-border) !important; color: #fca5a5; }

    .feedback-box {
      border-radius: 10px;
      padding: 12px 16px;
      margin-bottom: 20px;
      font-size: 13px;
    }
    .feedback-box.correct { background: var(--success-bg); border: 1px solid var(--success-border); color: #a7f3d0; }
    .feedback-box.wrong { background: var(--danger-bg); border: 1px solid var(--danger-border); color: #fecaca; }

    .nav-actions { display: flex; justify-content: space-between; gap: 12px; }
    .btn {
      padding: 10px 18px;
      border-radius: 10px;
      font-size: 14px;
      font-weight: 700;
      cursor: pointer;
      border: none;
    }
    .btn-secondary { background: var(--border); color: var(--text); }
    .btn-primary { background: var(--primary); color: #fff; }
    .btn:disabled { opacity: 0.4; cursor: not-allowed; }

    /* RESULT SCREEN */
    .result-box { text-align: center; padding: 20px 0; }
    .score-big { font-size: 48px; font-weight: 800; color: var(--primary); margin: 10px 0; }
    .advice-card {
      background: #243144;
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 16px;
      font-size: 14px;
      margin: 20px 0;
      text-align: left;
    }
  </style>
</head>
<body>

  <div class="container">
    
    <!-- HOME SCREEN -->
    <div id="screen-home" class="card">
      <div class="app-header">
        <h1>Simulasi PSTS/ASTS KLS 8</h1>
        <p>Pilih mata pelajaran untuk mulai latihan soal:</p>
      </div>
      <div class="subject-grid">
        <button class="btn-subject" id="btn-start-inggris">
          <h3>🇬🇧 Bahasa Inggris</h3>
          <span>50 Soal • Pilihan Ganda</span>
        </button>
        <button class="btn-subject" id="btn-start-seni">
          <h3>🎨 Seni Rupa</h3>
          <span>50 Soal • Pilihan Ganda</span>
        </button>
      </div>
    </div>

    <!-- QUIZ SCREEN -->
    <div id="screen-quiz" class="card hidden">
      <div class="quiz-bar">
        <span id="quiz-badge" class="badge">Mata Pelajaran</span>
        <span id="quiz-num" class="meta-text">Soal 1 dari 50</span>
      </div>
      <div class="progress-track">
        <div id="progress-fill" class="progress-fill"></div>
      </div>

      <div id="question-text" class="question-text"></div>
      <div id="options-list" class="options-list"></div>
      
      <div id="feedback-box" class="feedback-box hidden"></div>

      <div class="nav-actions">
        <button class="btn btn-secondary" id="btn-exit">🏠 Keluar</button>
        <button id="btn-next" class="btn btn-primary" disabled>Soal Berikutnya ➜</button>
      </div>
    </div>

    <!-- RESULT SCREEN -->
    <div id="screen-result" class="card hidden">
      <div class="result-box">
        <h2>Ujian Selesai!</h2>
        <p class="meta-text">Hasil perolehan nilai kamu:</p>
        <div id="score-display" class="score-big">0/50</div>
        <p id="score-percent" class="meta-text" style="font-size: 16px; font-weight:700;"></p>
        <div id="advice-text" class="advice-card"></div>
        <button class="btn btn-primary" id="btn-restart">🔄 Kembali ke Menu Utama</button>
      </div>
    </div>

  </div>

<script>
// BAHASA INGGRIS DATA (50)
const dataInggris = [
  { q: "Teacher: \"_____, open your book on page 12.\" What is the suitable expression?", o: ["Attention, please", "I agree with you", "Happy birthday", "Good night"], c: 0, e: "Jawaban: 'Attention, please'. Digunakan untuk meminta perhatian." },
  { q: "Student: \"_____ I wash my hands, Sir?\"\nTeacher: \"Yes, sure.\"", o: ["May", "Must", "Will", "Should"], c: 0, e: "Jawaban: 'May'. Digunakan untuk meminta izin secara sopan." },
  { q: "Teacher: \"Keep quiet, please! The test is starting.\"\nWhat does the teacher mean?", o: ["Asking students to be quiet", "Asking students to speak louder", "Asking students to read", "Asking students to leave"], c: 0, e: "Jawaban: Meminta siswa tenang/diam." },
  { q: "Student: \"Sorry for being late, Ma'am.\"\nTeacher: \"_____. Sit down, please.\"", o: ["That's alright", "You are welcome", "I don't care", "Goodbye"], c: 0, e: "Jawaban: 'That's alright' untuk merespons permohonan maaf." },
  { q: "Teacher: \"_____ the whiteboard, please!\"\nStudent: \"Yes, Sir.\"", o: ["Clean", "Eat", "Sleep", "Listen"], c: 0, e: "Jawaban: 'Clean' (bersihkan papan tulis)." },
  { q: "Rani: \"I made this cupcake for you.\"\nSiti: \"Wow, _____! It tastes amazing!\"", o: ["What a delicious cupcake", "How terrible it is", "I hate it", "It is so bad"], c: 0, e: "Jawaban: 'What a delicious cupcake' (pujian makanan enak)." },
  { q: "Deni: \"Look at my new drawing.\"\nBudi: \"_____. You are so talented!\"", o: ["That's fantastic", "It looks messy", "I don't like it", "You should stop"], c: 0, e: "Jawaban: 'That's fantastic' (ungkapan pujian)." },
  { q: "Which statement is an expression of compliment?", o: ["You look great today!", "Where are you going?", "I don't feel good.", "Please open the door."], c: 0, e: "Jawaban: 'You look great today!'." },
  { q: "Sinta: \"What a beautiful dress!\"\nLestari: \"_____.\"", o: ["Thank you very much", "No problem", "I am sorry", "You're welcome"], c: 0, e: "Jawaban: 'Thank you very much'." },
  { q: "John: \"You played the guitar so well!\"\nAlex: \"_____.\"", o: ["I'm glad you liked it", "I am not fine", "It is terrible", "Don't look at me"], c: 0, e: "Jawaban: 'I'm glad you liked it'." },
  { q: "Riko: \"Are you sure we have homework today?\"\nDino: \"_____. The teacher told us this morning.\"", o: ["Yes, I am certain", "I am not sure", "I doubt it", "I don't know"], c: 0, e: "Jawaban: 'Yes, I am certain' (yakin)." },
  { q: "Siti: \"Is the library open on Sunday?\"\nLia: \"I'm 100% sure it is closed.\" Lia expresses _____.", o: ["certainty", "uncertainty", "dislike", "congratulation"], c: 0, e: "Jawaban: certainty (kepastian)." },
  { q: "Which expression shows certainty?", o: ["I am absolutely sure about it.", "Maybe it will rain.", "I have no idea.", "I am not really sure."], c: 0, e: "Jawaban: 'I am absolutely sure about it.'." },
  { q: "Andi: \"Will our team win the match?\"\nBagas: \"_____. They have trained hard for weeks.\"", o: ["I'm positive about that", "I am doubtful", "I don't think so", "Maybe not"], c: 0, e: "Jawaban: 'I'm positive about that'." },
  { q: "Teacher: \"Is Paris the capital of France?\"\nStudent: \"Yes, I am _____ sure it is.\"", o: ["completely", "doubtfully", "hesitantly", "never"], c: 0, e: "Jawaban: 'completely' (sangat yakin)." },
  { q: "Maya: \"Will Mr. Han come to class today?\"\nEko: \"_____. He said he felt unwell yesterday.\"", o: ["I'm not really sure", "I am certain", "Without a doubt", "Definitely yes"], c: 0, e: "Jawaban: 'I'm not really sure' (tidak yakin)." },
  { q: "Rizal: \"Is the concert starting at 7 PM?\"\nFani: \"_____. We should check the ticket again.\"", o: ["I doubt it", "I am 100% sure", "It is certain", "Of course"], c: 0, e: "Jawaban: 'I doubt it' (ragu)." },
  { q: "Expressing uncertainty means you are _____ about something.", o: ["not sure", "very confident", "happy", "angry"], c: 0, e: "Jawaban: 'not sure'." },
  { q: "Dina: \"Do you think it will rain this afternoon?\"\nToni: \"_____ because the sky is cloudy, but who knows?\"", o: ["I'm not certain", "I am sure", "I am positive", "Definitely"], c: 0, e: "Jawaban: 'I'm not certain'." },
  { q: "Which phrase shows uncertainty?", o: ["I have doubts about that.", "I am totally sure.", "I know for certain.", "It is clear."], c: 0, e: "Jawaban: 'I have doubts about that.'." },
  { q: "I _____ playing football in the afternoon. It is my favorite hobby.", o: ["enjoy", "hate", "dislike", "cannot stand"], c: 0, e: "Jawaban: 'enjoy'." },
  { q: "Siska: \"Do you like spicy food?\"\nDoni: \"No, I _____. It hurts my stomach.\"", o: ["dislike it", "love it", "am fond of it", "really enjoy it"], c: 0, e: "Jawaban: 'dislike it'." },
  { q: "Maya: \"What do you think of horror movies?\"\nLia: \"I _____ them. They give me nightmares!\"", o: ["hate", "love", "like", "enjoy"], c: 0, e: "Jawaban: 'hate' (benci)." },
  { q: "Which sentence expresses a preference/like?", o: ["I am crazy about pop music.", "I can't stand loud noises.", "I detest waiting in line.", "I don't like coffee."], c: 0, e: "Jawaban: 'I am crazy about pop music.'." },
  { q: "Budi: \"I really like swimming.\"\nWhich word has the same meaning as 'like'?", o: ["Enjoy", "Dislike", "Avoid", "Hate"], c: 0, e: "Jawaban: 'Enjoy'." },
  { q: "What is the main purpose of a recount text?", o: ["To retell past events or experiences", "To describe a person in detail", "To persuade readers to buy something", "To explain how to make something"], c: 0, e: "Jawaban: Menceritakan pengalaman masa lalu." },
  { q: "The generic structure of a Recount Text is _____.", o: ["Orientation - Events - Reorientation", "Identification - Description", "Goal - Materials - Steps", "Thesis - Arguments - Conclusion"], c: 0, e: "Jawaban: Orientation - Events - Reorientation." },
  { q: "In a recount text, 'Orientation' provides information about _____.", o: ["Who, where, and when the story happened", "The final resolution of the problem", "Steps to solve a issue", "A list of tools needed"], c: 0, e: "Jawaban: Tokoh, tempat, dan waktu kejadian." },
  { q: "Recount text mostly uses which tense?", o: ["Simple Past Tense", "Simple Present Tense", "Future Tense", "Present Continuous Tense"], c: 0, e: "Jawaban: Simple Past Tense." },
  { q: " \"Last week, my family and I went to Kuta Beach.\" This sentence belongs to _____.", o: ["Orientation", "Events", "Reorientation", "Resolution"], c: 0, e: "Jawaban: Orientation." },
  { q: "They _____ to Bali for holiday last month.", o: ["went", "go", "goes", "going"], c: 0, e: "Jawaban: 'went' (V2 dari go)." },
  { q: "She _____ a delicious dinner for us yesterday.", o: ["cooked", "cooks", "cooking", "is cooking"], c: 0, e: "Jawaban: 'cooked'." },
  { q: "Negative form of 'He bought a new bicycle yesterday' is _____.", o: ["He did not buy a new bicycle yesterday", "He does not buy a new bicycle yesterday", "He did not bought a new bicycle yesterday", "He was not buy a new bicycle yesterday"], c: 0, e: "Jawaban: 'He did not buy...'." },
  { q: "_____ you watch the football match on TV last night?", o: ["Did", "Do", "Does", "Were"], c: 0, e: "Jawaban: 'Did'." },
  { q: "I _____ very tired after running yesterday afternoon.", o: ["was", "were", "am", "is"], c: 0, e: "Jawaban: 'was'." },
  { q: "First, wash the apples. _____, cut them into small pieces.", o: ["Then", "Last year", "Yesterday", "Ago"], c: 0, e: "Jawaban: 'Then'." },
  { q: "Which word is NOT a time connective?", o: ["Beautiful", "After that", "Finally", "Next"], c: 0, e: "Jawaban: 'Beautiful'." },
  { q: "We visited the museum. _____, we had lunch at a nearby restaurant.", o: ["Afterward", "Because", "Although", "In order to"], c: 0, e: "Jawaban: 'Afterward'." },
  { q: "_____ we finished our test, we collected the answer sheets.", o: ["After", "Beforehand", "Next week", "In the future"], c: 0, e: "Jawaban: 'After'." },
  { q: "\"_____ , we arrived safely at home around 9 PM.\"", o: ["Finally", "First", "Initially", "To begin with"], c: 0, e: "Jawaban: 'Finally'." },
  { q: "Someone who likes to share things with others is _____.", o: ["generous", "stingy", "arrogant", "lazy"], c: 0, e: "Jawaban: 'generous' (dermawan)." },
  { q: "Doni always says 'please' and 'thank you'. He is a very _____ boy.", o: ["polite", "rude", "dishonest", "greedy"], c: 0, e: "Jawaban: 'polite' (sopan)." },
  { q: "Sarah never tells lies. Everyone trusts her because she is _____.", o: ["honest", "cruel", "careless", "selfish"], c: 0, e: "Jawaban: 'honest' (jujur)." },
  { q: "A person who doesn't like working or doing any effort is called _____.", o: ["lazy", "hardworking", "diligent", "active"], c: 0, e: "Jawaban: 'lazy'." },
  { q: "Rian is very _____. He always helps his mother clean the house.", o: ["helpful", "stubborn", "shy", "impatient"], c: 0, e: "Jawaban: 'helpful'." },
  { q: "Siti won the first prize in storytelling competition. What should you say?", o: ["Congratulations on your victory!", "I am sorry to hear that.", "Get well soon!", "Happy New Year!"], c: 0, e: "Jawaban: 'Congratulations on your victory!'." },
  { q: "Rifky: \"I just passed the final exam!\"\nBobi: \"_____! I'm so proud of you!\"", o: ["Congratulations", "Good luck next time", "I hope you fail", "Pardon me"], c: 0, e: "Jawaban: 'Congratulations'." },
  { q: "Which situation requires you to say 'Congratulations'?", o: ["Your friend graduates from university", "Your friend gets sick", "Your friend loses wallet", "Your friend is crying"], c: 0, e: "Jawaban: Lulus kuliah." },
  { q: "Dita: \"Congratulations on winning the match!\"\nEdo: \"_____.\"", o: ["Thank you so much", "Don't mention it", "I am bad", "Never mind"], c: 0, e: "Jawaban: 'Thank you so much'." },
  { q: "\"Wishing you all the best on your success!\" Expresses _____.", o: ["congratulation", "apology", "sympathy", "disagreement"], c: 0, e: "Jawaban: Congratulation." }
];

// SENI RUPA DATA (50)
const dataSeni = [
  { q: "Kata 'perspektif' berasal dari bahasa Latin, yaitu 'perspicere' yang berarti _____", o: ["Melihat secara tepat / menembus", "Menggambar indah", "Melukis alam", "Memotong bidang"], c: 0, e: "Perspicere = melihat secara tepat/menembus." },
  { q: "Pengamatan objek di mana posisi mata pengamat berada jauh di bawah objek dinamakan sudut pandang mata _____", o: ["Cacing / Burung bawah", "Normal", "Burung / Katak", "Samping"], c: 0, e: "Sudut pandang mata cacing (posisi di bawah objek)." },
  { q: "Ahmad berdiri di lantai 15 dan melihat mobil tampak sangat kecil. Jenis sudut pandangnya adalah _____", o: ["Mata Burung (Bird's eye view)", "Mata Normal", "Mata Cacing", "Mata Samping"], c: 0, e: "Sudut pandang mata burung (posisi dari tinggi ke bawah)." },
  { q: "Sudut pandang mata yang posisinya sejajar dengan tinggi mata manusia dinamakan sudut pandang mata _____", o: ["Normal", "Cacing", "Burung", "Luar"], c: 0, e: "Mata normal sejajar tinggi pengamat." },
  { q: "Pernyataan yang tepat mengenai gambar perspektif adalah _____", o: ["Teknik menggambar objek 3D pada bidang datar sesuai pandangan mata", "Teknik menggambar dengan lingkaran", "Gambar tanpa titik hilang", "Gambar mengabaikan jarak"], c: 0, e: "Memindahkan bentuk 3D ke 2D sesuai pandangan mata." },
  { q: "Di tengah rel kereta api yang lurus, rel tampak menyatu pada satu titik di kejauhan. Ini menerapkan perspektif _____", o: ["1 Titik Hilang", "2 Titik Hilang", "3 Titik Hilang", "Tanpa Titik Hilang"], c: 0, e: "Objek lurus memusat ke 1 titik." },
  { q: "Gambar koridor sekolah yang memanjang lurus ke depan menggunakan teknik perspektif _____", o: ["1 Titik Hilang", "2 Titik Hilang", "3 Titik Hilang", "4 Titik Hilang"], c: 0, e: "Koridor lurus menggunakan 1 titik hilang." },
  { q: "Pengertian dari garis horizon dalam menggambar perspektif adalah _____", o: ["Garis khayal yang menunjukkan tingginya pandangan mata pengamat", "Garis tebal di bawah kertas", "Garis pemotong vertikal", "Garis melingkar"], c: 0, e: "Garis khayal pembatas mata pengamat." },
  { q: "Fungsi utama titik hilang pada gambar perspektif adalah _____", o: ["Sebagai pusat pertemuan garis-garis sejajar yang menjauh dari mata", "Sebagai hiasan gambar", "Untuk mewarnai latar", "Sebagai garis tepi"], c: 0, e: "Titik temu garis yang menjauh." },
  { q: "Menggambar sudut luar gedung bertingkat di mana kedua sisinya miring ke kanan dan kiri menggunakan perspektif _____", o: ["2 Titik Hilang", "1 Titik Hilang", "Katak", "Mata Normal"], c: 0, e: "Melihat dari sudut luar memakai 2 titik hilang." },
  { q: "Lokasi dua titik hilang pada perspektif 2 titik hilang terletak pada garis horizon di sebelah _____", o: ["Kiri dan kanan", "Atas dan bawah", "Tengah saja", "Depan dan belakang"], c: 0, e: "Berada di ujung kiri dan kanan horizon." },
  { q: "Kaidah utama dalam perspektif 2 titik hilang adalah _____", o: ["Garis horizontal objek menuju ke 2 titik hilang di garis horizon", "Semua garis digambar melengkung", "Objek jauh digambar lebih besar", "Tanpa garis horizon"], c: 0, e: "Garis horizontal memusat ke 2 titik." },
  { q: "Menggambar interior kamar dari posisi sudut ruangan paling tepat memakai perspektif _____", o: ["2 Titik Hilang", "1 Titik Hilang", "3 Titik Hilang", "Tanpa Titik Hilang"], c: 0, e: "Sudut ruangan memakai 2 titik hilang." },
  { q: "Pernyataan yang BENAR mengenai perspektif 2 titik hilang adalah _____", o: ["Memiliki 2 titik fokus pada garis horizon untuk melihat dari sudut objek", "Objek tampak rata", "Hanya untuk lingkaran", "Titik hilang di luar horizon"], c: 0, e: "Memiliki 2 titik fokus di garis horizon." },
  { q: "Akibat lokasi titik hilang terlalu dekat satu sama lain pada perspektif 2 titik hilang adalah _____", o: ["Gambar objek tampak distorsi / janggal", "Gambar sangat realistis", "Warna memudar", "Garis hilang otomatis"], c: 0, e: "Menyebabkan distorsi/bentuk janggal." },
  { q: "Semakin jauh posisi suatu benda dari mata pengamat, maka benda tersebut akan tampak _____", o: ["Semakin kecil", "Semakin besar", "Semakin tebal", "Ukuran tetap"], c: 0, e: "Makin jauh benda makin kecil." },
  { q: "Pemandangan jalan berbelok di bukit menerapkan hukum perspektif di mana _____", o: ["Warna dan detail benda di kejauhan makin pudar", "Warna benda makin tajam", "Ukuran pohon tidak berubah", "Objek dekat terlihat kecil"], c: 0, e: "Perspektif warna: detail & warna makin jauh makin pudar." },
  { q: "Contoh benda yang paling tepat digambar dengan perspektif 2 titik hilang adalah _____", o: ["Kotak kemasan / lemari yang dilihat dari sudutnya", "Bola basket", "Cermin datar", "Papan tulis"], c: 0, e: "Melihat sudut lemari/kotak." },
  { q: "Arsitek menggambar rancangan rumah dari tampak sudut depan menggunakan teknik perspektif _____", o: ["2 Titik Hilang", "1 Titik Hilang", "3 Titik Hilang", "Mata Cacing"], c: 0, e: "Tampak sudut = 2 titik hilang." },

  { q: "Prinsip 'Kesatuan' (Unity) berarti _____", o: ["Seluruh unsur saling mendukung membentuk karya utuh", "Menggambar satu objek saja", "Memisah-misahkan gambar", "Menggunakan 1 warna"], c: 0, e: "Keterpaduan antar unsur." },
  { q: "Menggambar cangkir raksasa di sebelah teko kecil melanggar prinsip _____", o: ["Proporsi", "Keseimbangan", "Tekstur", "Gelap Terang"], c: 0, e: "Melanggar prinsip perbandingan ukuran (Proporsi)." }
];

// STATE MANAGEMENT
let activeQuiz = [];
let currentIdx = 0;
let totalScore = 0;
let userHasAnswered = false;

// SHUFFLE FUNCTION
function shuffle(array) {
  let arr = [...array];
  for (let i = arr.length - 1; i > 0; i--) {
    let j = Math.floor(Math.random() * (i + 1));
    let temp = arr[i];
    arr[i] = arr[j];
    arr[j] = temp;
  }
  return arr;
}

// START QUIZ
function startQuiz(type) {
  let raw = (type === 'inggris') ? dataInggris : dataSeni;
  let title = (type === 'inggris') ? "🇬🇧 Bahasa Inggris" : "🎨 Seni Rupa";

  // Process and shuffle options
  activeQuiz = raw.map(item => {
    let originalOptions = [...item.o];
    let correctAnswerText = originalOptions[item.c];
    let shuffledOptions = shuffle(originalOptions);
    let newCorrectIndex = shuffledOptions.indexOf(correctAnswerText);

    return {
      q: item.q,
      o: shuffledOptions,
      c: newCorrectIndex,
      e: item.e
    };
  });

  currentIdx = 0;
  totalScore = 0;

  document.getElementById('quiz-badge').innerText = title;
  document.getElementById('screen-home').classList.add('hidden');
  document.getElementById('screen-result').classList.add('hidden');
  document.getElementById('screen-quiz').classList.remove('hidden');

  loadQuestion();
}

// RENDER QUESTION
function loadQuestion() {
  userHasAnswered = false;
  let qData = activeQuiz[currentIdx];

  document.getElementById('quiz-num').innerText = `Soal ${currentIdx + 1} dari ${activeQuiz.length}`;
  document.getElementById('progress-fill').style.width = `${(currentIdx / activeQuiz.length) * 100}%`;
  document.getElementById('question-text').innerText = qData.q;

  let optionsContainer = document.getElementById('options-list');
  optionsContainer.innerHTML = '';

  let prefixes = ['A', 'B', 'C', 'D'];
  qData.o.forEach((optText, i) => {
    let btn = document.createElement('button');
    btn.className = 'btn-option';
    btn.innerHTML = `<strong>${prefixes[i]}.</strong> <span>${optText}</span>`;
    btn.onclick = function() { checkAnswer(i); };
    optionsContainer.appendChild(btn);
  });

  let fb = document.getElementById('feedback-box');
  fb.className = 'feedback-box hidden';
  fb.innerHTML = '';

  let btnNext = document.getElementById('btn-next');
  btnNext.disabled = true;
  btnNext.innerText = (currentIdx === activeQuiz.length - 1) ? "Lihat Hasil 🎯" : "Soal Berikutnya ➜";
}

// CHECK ANSWER
function checkAnswer(chosenIndex) {
  if (userHasAnswered) return;
  userHasAnswered = true;

  let qData = activeQuiz[currentIdx];
  let allButtons = document.querySelectorAll('.btn-option');
  let fb = document.getElementById('feedback-box');

  allButtons.forEach(btn => btn.disabled = true);
  allButtons[qData.c].classList.add('opt-correct');

  if (chosenIndex === qData.c) {
    totalScore++;
    fb.className = 'feedback-box correct';
    fb.innerHTML = `<strong>✅ JAWABAN BENAR!</strong><br>${qData.e}`;
  } else {
    allButtons[chosenIndex].classList.add('opt-wrong');
    let prefixes = ['A', 'B', 'C', 'D'];
    fb.className = 'feedback-box wrong';
    fb.innerHTML = `<strong>❌ KURANG TEPAT</strong><br>Jawaban benar: <strong>${prefixes[qData.c]}. ${qData.o[qData.c]}</strong><br>${qData.e}`;
  }

  fb.classList.remove('hidden');
  document.getElementById('btn-next').disabled = false;
}

// NEXT QUESTION
function handleNext() {
  if (!userHasAnswered) return;

  if (currentIdx < activeQuiz.length - 1) {
    currentIdx++;
    loadQuestion();
  } else {
    renderResult();
  }
}

// RESULT
function renderResult() {
  document.getElementById('screen-quiz').classList.add('hidden');
  document.getElementById('screen-result').classList.remove('hidden');

  let total = activeQuiz.length;
  let finalVal = Math.round((totalScore / total) * 100);

  document.getElementById('score-display').innerText = `${totalScore} / ${total}`;
  document.getElementById('score-percent').innerText = `Nilai Akhir: ${finalVal}`;

  let advice = document.getElementById('advice-text');
  if (finalVal >= 85) {
    advice.innerHTML = "<strong>🔥 Bagus Banget!</strong> Pemahaman materi lu udah matang. Tinggal pertahankan pas hari-H!";
  } else if (finalVal >= 70) {
    advice.innerHTML = "<strong>👍 Sudah Lumayan!</strong> Nilai lu udah aman, cuma ada beberapa soal yang kecolongan. Bisa pelajari lagi penjelasan soal yang salah tadi.";
  } else {
    advice.innerHTML = "<strong>📚 Perlu Latihan Lagi!</strong> Jangan patah semangat, coba baca-baca lagi materi dan ulangi latihannya sekali lagi ya!";
  }
}

// BIND EVENTS ON LOAD
window.onload = function() {
  document.getElementById('btn-start-inggris').onclick = function() { startQuiz('inggris'); };
  document.getElementById('btn-start-seni').onclick = function() { startQuiz('seni'); };
  document.getElementById('btn-next').onclick = handleNext;
  document.getElementById('btn-exit').onclick = goHome;
  document.getElementById('btn-restart').onclick = goHome;
};

function goHome() {
  document.getElementById('screen-quiz').classList.add('hidden');
  document.getElementById('screen-result').classList.add('hidden');
  document.getElementById('screen-home').classList.remove('hidden');
}
</script>
